# Resets the public demo every 6 hours: restores the saved data, removes anything
# visitors added, reloads the sample data and resets the demo login passwords.
# Running this often also stops the free Supabase project from pausing (it pauses
# after 7 days without activity).
name: Reset demo data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: demo-reset

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # A paused Supabase project stops resolving (or answers 540). That's expected,
      # so skip the reset quietly instead of failing and sending an email every run.
      - name: Check Supabase is running
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$SUPABASE_URL/auth/v1/health") || curl_exit=$?
          if [ "${curl_exit:-0}" = "6" ] || [ "$code" = "540" ]; then
            echo "::notice::Supabase project is paused, so the demo reset was skipped."
            echo "paused=true" >> "$GITHUB_OUTPUT"
          else
            echo "Supabase responded (HTTP $code)"
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reset demo
        if: steps.check.outputs.paused != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node backend/scripts/demo/reset-demo.mjs

      # GitHub switches off scheduled jobs in repos with no commits for 60 days.
      # If the repo has been quiet for 50+ days, push an empty commit to keep this job running.
      - name: Keep the schedule enabled
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit was $age_days days ago"
          if [ "$age_days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled workflow active"
            git push
          fi
